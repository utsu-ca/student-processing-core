apiVersion: v1
kind: Service
metadata:
  name: mailsvc
  namespace: utsu-portal
  labels:
    app: mailsvc
spec:
  selector:
    app: mailsvc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailsvc
  namespace: utsu-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mailsvc
  template:
    metadata:
      labels:
        app: mailsvc
    spec:
      containers:
      - name: mailsvc
        image: utsu-mailsvc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORTAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: mailsvc-secrets
              key: service-token
        - name: PORTAL_SMTP_URL
          valueFrom:
            secretKeyRef:
              name: mailsvc-secrets
              key: smtp-url
        - name: PORTAL_MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: mailsvc-secrets
              key: mail-from
        - name: DATABASE_URL
          value: "postgresql://mailsvc:password@postgres:5432/mailsvc_db"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /docs
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /mail/pending?limit=1
            port: 8080
            httpHeaders:
            - name: Authorization
              value: Bearer $(PORTAL_SERVICE_TOKEN)
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: mailsvc-secrets
  namespace: utsu-portal
type: Opaque
stringData:
  service-token: "your-32-character-minimum-service-token-here"
  smtp-url: "smtps://user:pass@smtp.example.com:465"
  mail-from: "noreply@example.org"
