[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utsu-student-matching"
version = "0.1.0"
description = "UTSU student verification: Senate applications, Student Aid Bursary (SABP), AGM voter RSVPs, and mail-merge."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
utsu-all = "utsu_programs.runner:main"
utsu-senate = "utsu_programs.senate.cli:main"
utsu-sap = "utsu_programs.sap.cli:main"
utsu-agm = "utsu_programs.agm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["utsu_core*", "utsu_programs*", "utsu_std*", "utsu_mail*"]

[tool.setuptools.package-data]
utsu_core = ["schema/*.sql"]
"utsu_programs.senate" = ["*.sql"]
"utsu_programs.sap" = ["*.sql"]
"utsu_programs.agm" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
