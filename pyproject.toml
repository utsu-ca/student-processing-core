[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utsu-student-matching"
version = "0.1.0"
description = "UTSU student verification: Senate applications, Student Aid Bursary (SABP), AGM voter RSVPs, and mail-merge."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "httpx", "fakeredis"]
portal = ["fastapi>=0.110", "uvicorn", "pyyaml", "cryptography>=50", "segno>=1.6.6", "redis>=5", "google-re2>=1.1"]
firestore = ["google-cloud-firestore"]
sql = ["sqlalchemy>=2"]  # + a driver: psycopg (PostgreSQL/Supabase), pyodbc (Azure SQL), pymysql
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-jaeger>=1.20",
    "opentelemetry-exporter-prometheus>=0.41b0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-flask>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-asyncio>=0.41b0",
    "opentelemetry-propagators-jaeger>=1.20"
]
filesvc = [
    "boto3>=1.26",  # AWS S3
    "google-cloud-storage>=2.10",  # Google Cloud Storage
    "azure-storage-blob>=12.17",  # Azure Blob Storage
]
authsvc = [
    "pyjwt>=2.8",  # JWT tokens for service auth
    "bcrypt>=4.1",  # Password hashing
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["utsu_core*", "utsu_std*", "utsu_mail*", "utsu_portal*"]

[tool.setuptools.package-data]
utsu_portal = ["static/*", "forms/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
