apiVersion: apps/v1
kind: Deployment
metadata: {name: auth, namespace: utsu-portal, labels: {app: auth}}
spec:
  replicas: 2
  selector: {matchLabels: {app: auth}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: auth}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          image: ghcr.io/utsu-ca/student-processing-core:latest   # pin by digest in production
          env:
            - {name: PORTAL_APP, value: "utsu_portal.authsvc:create_auth_app"}
            - {name: PORT, value: "8080"}
            - {name: DATABASE_URL_FILE, value: /run/secrets/portal/database-url}
            - {name: PORTAL_AUTH_SIGNING_KEY_FILE, value: /run/secrets/portal/auth-signing-key}
            - {name: PORTAL_SMTP_URL_FILE, value: /run/secrets/portal/smtp-url}
            - {name: PORTAL_AUTH_URL, value: ""}
          envFrom: [{configMapRef: {name: portal-config}}]
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 20}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets/portal, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: auth-secrets, defaultMode: 0440}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: auth, namespace: utsu-portal}
spec:
  selector: {app: auth}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: auth, namespace: utsu-portal}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: auth}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: auth, namespace: utsu-portal}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: auth}}
