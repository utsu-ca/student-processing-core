# Updated auth service deployment with RBAC module

apiVersion: v1
kind: Service
metadata:
  name: authsvc
  namespace: utsu-portal
  labels:
    app: authsvc
spec:
  selector:
    app: authsvc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authsvc
  namespace: utsu-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: authsvc
  template:
    metadata:
      labels:
        app: authsvc
    spec:
      containers:
      - name: authsvc
        image: utsu-authsvc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORTAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: authsvc-secrets
              key: service-token
        - name: PORTAL_MAIL_ENDPOINT
          value: "http://mailsvc:8080"
        - name: PORTAL_AUDIT_DB_ACCESS
          value: "true"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /docs
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /internal/ping
            port: 8080
            httpHeaders:
            - name: Authorization
              value: Bearer $(PORTAL_SERVICE_TOKEN)
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: authsvc-secrets
  namespace: utsu-portal
type: Opaque
stringData:
  service-token: "your-32-character-minimum-service-token-here"
