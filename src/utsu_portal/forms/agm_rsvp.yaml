id: agm_rsvp
version: 1
title: AGM Voter RSVP
description: Register to vote at the Annual General Meeting.
fields:
  - {id: attendance, type: radio, label: "How will you attend?", required: true, options: [In person, Online]}
  - {id: division, type: select, label: Division, required: true, options: [UTSG, UTM, UTSC]}
  - {id: accessibility, type: textarea, label: Accessibility needs, max: 1000}
  - {id: proxy, type: checkbox, label: I am voting by proxy}
  - id: proxy_name
    type: text
    label: Proxy holder's full name
    required: true
    max: 100
    show_if: {field: proxy, equals: true}
  - {id: eligible, type: checkbox, label: I confirm I am a UTSU member in good standing, required: true}
